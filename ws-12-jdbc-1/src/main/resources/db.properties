# ---------------------------------------------------------------
# JDBC connection properties
# Used by both the plain DriverManager examples and HikariCP pool
# Change the port to 30432 when connecting via Kubernetes NodePort
# ---------------------------------------------------------------

# --- Docker Compose (default) ---
db.url=jdbc:postgresql://localhost:5432/jdbc_demo
db.host=localhost
db.port=5432
db.name=jdbc_demo
db.user=jdbc_user
db.password=jdbc_pass


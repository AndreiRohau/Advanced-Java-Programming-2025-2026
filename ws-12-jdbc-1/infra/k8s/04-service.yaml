apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jdbc-demo
spec:
  selector:
    app: postgres
  type: NodePort
  ports:
    - protocol: TCP
      port: 5432          # cluster-internal port
      targetPort: 5432    # container port
      nodePort: 30432     # accessible on the WSL host at localhost:30432

